plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            // Session #80 (scheduled): required for any mixin-based mod
            // dependency (e.g. Curios, added this session as a soft
            // dependency - see the "curios-forge" dependency above) to
            // actually apply its mixins in this dev/test run. Without
            // these two properties, ForgeGradle's userdev environment
            // never remaps the dependency's Mixin refmap (SRG field/
            // method names -> this project's "official" mappings), so
            // any @Accessor/@Shadow mixin in the dependency fails with
            // InvalidAccessorException and crashes the whole GameTest
            // server before it generates a world - confirmed this
            // session against Curios's own AccessorEntity mixin
            // (targets Entity's long-standing "firstTick" field, SRG
            // name f_19803_). This is purely a dev-environment/userdev
            // quirk (see Curios issue #502 and SpongePowered/Mixin#462)
            // - a real production Forge install uses one consistent
            // runtime mapping for every mod's jar, so this mismatch
            // cannot occur there; this property pair only affects how
            // *this Gradle test run* resolves the dependency's mixins.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        // Curios API (session #80, scheduled): hosts CuriosAPI's own
        // release jars for Forge/MC 1.20.1. Curios is an optional/soft
        // dependency (see mods.toml) - this repo and the two
        // dependencies below only affect compile/runtime classpath
        // availability of the API, not whether the mod is present on a
        // given install. See issue #18 and CuriosCompat's javadoc for
        // the soft-dependency design.
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // JEI (2026-08-31 direct-chat session, TODO3/TODO4 follow-up):
        // hosts JEI's own release jars for Forge/MC 1.20.1 since January
        // 2023 (per JEI's own "Getting Started" wiki page). JEI is an
        // optional/soft dependency exactly like Curios above (see
        // mods.toml) - this repo and the dependencies below only affect
        // compile/runtime classpath availability of the API, not
        // whether JEI is present on a given player's install. See
        // com.claudemod.compat.jei's javadoc for the soft-dependency
        // design (mirrors CuriosCompat's).
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Compile against only the Curios API artifact (stable, public
    // surface only - see Curios's own dev docs, "Setting Up the
    // Development Environment", for why the "-api" classifier is
    // preferred over the full jar at compile time). The full jar is
    // still needed at runtime for local testing (this sandbox cannot
    // run a client, but CI's own gameTestServer smoke test can).
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Compile against only JEI's stable API artifacts (forge-api +
    // common-api, per JEI's own "Getting Started [Minecraft 1.18.2 to
    // 1.20.1]" wiki page), same "-api"-classifier-first reasoning as
    // Curios above. The full jar is only needed at runtime (local
    // testing/CI's gameTestServer smoke test) - a player without JEI
    // installed never needs runtimeOnly's jar at all, since it is never
    // packaged into this mod's own jar (no jarJar/shading here).
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license             : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
