# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

# Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod Properties
mod_id=claudemod
mod_name=ClaudeMod
mod_license=All Rights Reserved
mod_version=0.40.1
mod_group_id=com.claudemod
mod_authors=ClaudeMod Dev
mod_description=Adds a new dimension, energy system, blocks, mobs and gear focused on making exploration fun.

# Optional/soft compile-time dependency (session #80, scheduled):
# CuriosAPI version for MC 1.20.1 Forge, used only if the player has
# Curios installed (see mods.toml + CuriosCompat). Matches the latest
# 1.20.1 release on https://maven.theillusivec4.top/ as of this session.
curios_version=5.14.1+1.20.1

# Optional/soft compile-time dependency (2026-08-31 direct-chat session,
# TODO3/TODO4 follow-up): JEI (Just Enough Items) API version for MC
# 1.20.1 Forge, used only if the player has JEI installed (see
# mods.toml + com.claudemod.compat.jei). Matches the latest 1.20.1
# release on https://maven.blamejared.com/ as of this session (per
# https://maven.blamejared.com/mezz/jei/jei-1.20.1-forge/maven-metadata.xml).
jei_version=15.56.0.204

# Added after CI's first runGameTestServer attempt hit repeated
# SocketTimeoutException while downloading Minecraft asset files (e.g.
# minecraft/lang/szl.json) from Mojang's resource CDN, aborting the
# datapack-validation smoke test before it ever got to load registries.
# Raising Gradle's HTTP timeouts is a low-risk mitigation for what looks
# like transient CDN slowness on the Actions runner.
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000
