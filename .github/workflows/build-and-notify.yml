name: Build and Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-and-notify
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: build
        run: ./gradlew build --stacktrace
        continue-on-error: true

      - name: Determine result text
        id: result
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=✅ ビルド成功" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ ビルド失敗" >> "$GITHUB_OUTPUT"
          fi

      - name: Find built jar
        if: steps.build.outcome == 'success'
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish latest jar to repo
        if: steps.build.outcome == 'success' && steps.jar.outputs.path != ''
        run: |
          mkdir -p builds
          cp "${{ steps.jar.outputs.path }}" builds/ClaudeMod-latest.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/ClaudeMod-latest.jar
          git diff --cached --quiet || git commit -m "ci: update built jar [skip ci]"
          git push

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT_STATUS: ${{ steps.result.outputs.status }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping notification."
            exit 0
          fi

          # Build a bullet-point summary of every commit included in this push
          # (falls back to just the latest commit if the range can't be resolved,
          # e.g. first push or history rewrite).
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="$BEFORE_SHA..$AFTER_SHA"
          else
            RANGE="-1 $AFTER_SHA"
          fi

          CHANGES=$(git log $RANGE --no-merges --pretty=format:'%s' 2>/dev/null | grep -v '\[skip ci\]' | head -n 10)
          if [ -z "$CHANGES" ]; then
            CHANGES="$(git log -1 --pretty=%s)"
          fi

          # Best-effort Japanese translation of each commit line (free, unofficial
          # Google Translate endpoint; no API key needed). Falls back to the
          # original English line if translation fails for any reason.
          CHANGES_JA=$(python3 - "$CHANGES" << 'PYEOF'
          import sys, json, urllib.parse, urllib.request

          lines = [l for l in sys.argv[1].splitlines() if l.strip()]
          out = []
          for line in lines:
              try:
                  q = urllib.parse.quote(line)
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ja&dt=t&q={q}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  translated = "".join(seg[0] for seg in data[0])
              except Exception:
                  translated = line
              out.append(translated)
          print("\n".join(out))
          PYEOF
          )

          CHANGES_BULLETS=$(echo "$CHANGES" | sed 's/^/• /')
          CHANGES_JA_BULLETS=$(echo "$CHANGES_JA" | sed 's/^/• /')

          CONTENT=$(printf '%s  ClaudeMod ビルド結果\n\n変更内容(日本語訳):\n%s\n\n変更内容(原文):\n%s\n\n詳細: %s' "$RESULT_STATUS" "$CHANGES_JA_BULLETS" "$CHANGES_BULLETS" "$RUN_URL" | cut -c1-1900)
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Discord response HTTP $HTTP_CODE:"
          cat /tmp/discord_response.txt
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Discord notification failed with HTTP $HTTP_CODE"
          fi

      - name: Fail the job if the Gradle build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Build with Gradle step failed (outcome=${{ steps.build.outcome }})."
          echo "Failing this job now so the workflow's pass/fail status (badge, commit check, run list) is trustworthy."
          echo "Earlier steps used continue-on-error on the build step so the jar-publish and Discord-notify steps could still run/skip cleanly; this step restores an honest overall result."
          exit 1
