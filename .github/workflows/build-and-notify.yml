name: Build and Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: build-and-notify
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Delete flagged broken releases
        # See RELEASES_TO_DELETE.json for the format/rationale. This is the
        # sandbox-side dev-agent's way of removing a GitHub Release: the
        # sandbox that runs the scheduled sessions cannot reach api.github.com
        # (see PROGRESS.md), so it cannot call the Releases API directly. It
        # instead lists tag names to delete in this file and pushes; this
        # runner (which has full network access and a repo-scoped token via
        # the existing `contents: write` permission above) does the actual
        # deletion with `gh release delete --cleanup-tag`, then empties the
        # file and commits so it only fires once per entry.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f RELEASES_TO_DELETE.json ]; then
            echo "No RELEASES_TO_DELETE.json present; nothing to do."
            exit 0
          fi
          COUNT=$(jq 'length' RELEASES_TO_DELETE.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "RELEASES_TO_DELETE.json is empty; nothing to do."
            exit 0
          fi
          for TAG in $(jq -r '.[]' RELEASES_TO_DELETE.json); do
            echo "Deleting release+tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || echo "::warning::Failed to delete release $TAG (it may not exist, or was already deleted)"
          done
          echo "[]" > RELEASES_TO_DELETE.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASES_TO_DELETE.json
          git diff --cached --quiet || git commit -m "ci: clear processed RELEASES_TO_DELETE entries [skip ci]"
          git -c http.extraHeader= push || echo "::warning::Failed to push RELEASES_TO_DELETE.json cleanup"

      - name: Close flagged resolved issues
        # See ISSUES_TO_CLOSE.json for the format/rationale. Same relay
        # pattern as "Delete flagged broken releases" above: the sandbox
        # that runs the scheduled dev-agent sessions cannot reach
        # api.github.com, so it cannot call the Issues API directly to post
        # a resolution comment and close an issue. Instead it lists
        # {number, comment} entries in this file and pushes; this runner
        # (full network access, GITHUB_TOKEN now scoped with issues: write
        # above) posts the comment and closes the issue, then empties the
        # file and commits so each entry only fires once.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f ISSUES_TO_CLOSE.json ]; then
            echo "No ISSUES_TO_CLOSE.json present; nothing to do."
            exit 0
          fi
          COUNT=$(jq 'length' ISSUES_TO_CLOSE.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "ISSUES_TO_CLOSE.json is empty; nothing to do."
            exit 0
          fi
          jq -c '.[]' ISSUES_TO_CLOSE.json | while read -r ENTRY; do
            NUM=$(echo "$ENTRY" | jq -r '.number')
            MSG=$(echo "$ENTRY" | jq -r '.comment')
            echo "Closing issue #$NUM"
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$MSG" || echo "::warning::Failed to comment on issue #$NUM (it may not exist)"
            gh issue close "$NUM" --repo "${{ github.repository }}" || echo "::warning::Failed to close issue #$NUM (it may not exist, or was already closed)"
          done
          echo "[]" > ISSUES_TO_CLOSE.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ISSUES_TO_CLOSE.json
          git diff --cached --quiet || git commit -m "ci: clear processed ISSUES_TO_CLOSE entries [skip ci]"
          git -c http.extraHeader= push || echo "::warning::Failed to push ISSUES_TO_CLOSE.json cleanup"

      - name: Build with Gradle
        id: build
        run: ./gradlew build --stacktrace
        continue-on-error: true

      - name: Determine result text
        id: result
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=✅ ビルド成功" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ ビルド失敗" >> "$GITHUB_OUTPUT"
          fi

      - name: Find built jar
        if: steps.build.outcome == 'success'
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish latest jar to repo
        if: steps.build.outcome == 'success' && steps.jar.outputs.path != ''
        run: |
          mkdir -p builds
          cp "${{ steps.jar.outputs.path }}" builds/ClaudeMod-latest.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/ClaudeMod-latest.jar
          git diff --cached --quiet || git commit -m "ci: update built jar [skip ci]"
          git push

      - name: Validate datapack/registries (headless GameTest server smoke test)
        # gradlew build only *compiles and packages* - it never launches the
        # game, so a JSON file that is syntactically valid but semantically
        # wrong (bad registry reference, wrong codec shape, etc.) sails
        # through every CI run green and only surfaces the first time an
        # actual player opens Singleplayer, at which point Minecraft loads
        # *every* datapack registry (biome, dimension, worldgen feature,
        # biome_modifier, etc.) up front and throws
        # "Failed to load registries due to above errors" if any one entry
        # is invalid - this is exactly what happened in GitHub issue #11
        # (v0.3.0 wouldn't launch into Singleplayer at all). This step closes
        # that gap: runGameTestServer boots a real headless dedicated server
        # (same registry-loading code path as a player's Singleplayer world),
        # runs whatever @GameTest methods exist (none yet), and exits on its
        # own once done - no manual "stop" command needed, unlike runServer.
        id: datapack
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          timeout 900 ./gradlew runGameTestServer --stacktrace --console=plain < /dev/null > server_validation.log 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE"
          if grep -q "Failed to load registries" server_validation.log; then
            echo "status=registry_failure" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=other_failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi
          # Keep a human/agent-readable error digest AND the last part of the
          # full log, committed back to the repo (next section) so a future
          # sandbox session - which cannot run this server itself - can read
          # exactly what went wrong without needing Actions log UI access.
          grep -inE "ERROR|Exception|Failed to load|Invalid|Unknown registry|error:" server_validation.log | head -n 300 > server_validation_errors.log || true
          tail -n 500 server_validation.log > server_validation_tail.log || true

      - name: Publish datapack validation results to repo
        if: steps.build.outcome == 'success' && steps.datapack.outcome != 'skipped'
        run: |
          mkdir -p builds
          cp server_validation_errors.log builds/last_datapack_validation_errors.log 2>/dev/null || echo "(no errors log produced)" > builds/last_datapack_validation_errors.log
          cp server_validation_tail.log builds/last_datapack_validation_tail.log 2>/dev/null || echo "(no log produced)" > builds/last_datapack_validation_tail.log
          echo "status=${{ steps.datapack.outputs.status }}  commit=${{ github.sha }}  run=${{ github.run_id }}" > builds/last_datapack_validation_summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builds/last_datapack_validation_errors.log builds/last_datapack_validation_tail.log builds/last_datapack_validation_summary.txt
          git diff --cached --quiet || git commit -m "ci: update datapack validation results [skip ci]"
          git push

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT_STATUS: ${{ steps.result.outputs.status }}
          DATAPACK_STATUS: ${{ steps.datapack.outputs.status }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping notification."
            exit 0
          fi

          # Build a bullet-point summary of every commit included in this push
          # (falls back to just the latest commit if the range can't be resolved,
          # e.g. first push or history rewrite).
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="$BEFORE_SHA..$AFTER_SHA"
          else
            RANGE="-1 $AFTER_SHA"
          fi

          CHANGES=$(git log $RANGE --no-merges --pretty=format:'%s' 2>/dev/null | grep -v '\[skip ci\]' | head -n 10)
          if [ -z "$CHANGES" ]; then
            CHANGES="$(git log -1 --pretty=%s)"
          fi

          # Best-effort Japanese translation of each commit line (free, unofficial
          # Google Translate endpoint; no API key needed). Falls back to the
          # original English line if translation fails for any reason.
          CHANGES_JA=$(python3 - "$CHANGES" << 'PYEOF'
          import sys, json, urllib.parse, urllib.request

          lines = [l for l in sys.argv[1].splitlines() if l.strip()]
          out = []
          for line in lines:
              try:
                  q = urllib.parse.quote(line)
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ja&dt=t&q={q}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  translated = "".join(seg[0] for seg in data[0])
              except Exception:
                  translated = line
              out.append(translated)
          print("\n".join(out))
          PYEOF
          )

          CHANGES_BULLETS=$(echo "$CHANGES" | sed 's/^/• /')
          CHANGES_JA_BULLETS=$(echo "$CHANGES_JA" | sed 's/^/• /')

          case "$DATAPACK_STATUS" in
            registry_failure)
              DATAPACK_LINE="🔴 データパック検証: レジストリ読み込み失敗(実機で起動不能になる不具合の可能性)。builds/last_datapack_validation_errors.log を確認してください。"
              ;;
            other_failure)
              DATAPACK_LINE="🟡 データパック検証: サーバー起動テストで異常終了(内容確認要)。builds/last_datapack_validation_tail.log を確認してください。"
              ;;
            ok)
              DATAPACK_LINE="🟢 データパック検証: レジストリ読み込みOK"
              ;;
            *)
              DATAPACK_LINE=""
              ;;
          esac

          CONTENT=$(printf '%s  ClaudeMod ビルド結果\n%s\n\n変更内容(日本語訳):\n%s\n\n変更内容(原文):\n%s\n\n詳細: %s' "$RESULT_STATUS" "$DATAPACK_LINE" "$CHANGES_JA_BULLETS" "$CHANGES_BULLETS" "$RUN_URL" | cut -c1-1900)
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Discord response HTTP $HTTP_CODE:"
          cat /tmp/discord_response.txt
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Discord notification failed with HTTP $HTTP_CODE"
          fi

      - name: Fail the job if the Gradle build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Build with Gradle step failed (outcome=${{ steps.build.outcome }})."
          echo "Failing this job now so the workflow's pass/fail status (badge, commit check, run list) is trustworthy."
          echo "Earlier steps used continue-on-error on the build step so the jar-publish and Discord-notify steps could still run/skip cleanly; this step restores an honest overall result."
          exit 1
