modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Konpeitou24/ClaudeMod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Optional/soft dependency (session #80, scheduled - issue #18): Curios
# is not required to play ClaudeMod. When it IS present, four existing
# passive charm items (Prismium Featherstone/Emberguard/Vitastone/Magnet
# Charm) can also be worn in a Curios "charm" slot instead of just
# carried in the inventory - see CuriosCompat and
# data/curios/tags/items/charm.json. mandatory=false so the mod loads
# fine with Curios completely absent.
[[dependencies.${mod_id}]]
    modId = "curios"
    mandatory = false
    versionRange = "[5.0,)"
    ordering = "NONE"
    side = "BOTH"

# Optional/soft dependency (2026-08-31 direct-chat session, TODO3/TODO4
# follow-up - issue reported: "JEIのレシピ画面上でWキー長押しの詳細表示が
# 効かない"). JEI is not required to play ClaudeMod. When it IS present,
# the item-details overlay (hold W) can also show details for whatever
# ingredient JEI itself reports under the mouse on JEI's own screens
# (recipe view, ingredient list, bookmarks), not just for the slot under
# the mouse in this mod's own container screens - see
# com.claudemod.compat.jei.ClaudeModJeiPlugin. mandatory=false so the mod
# loads fine with JEI completely absent. side="CLIENT" since JEI itself
# is a client-only mod.
[[dependencies.${mod_id}]]
    modId = "jei"
    mandatory = false
    versionRange = "[15.0,)"
    ordering = "NONE"
    side = "CLIENT"
